name: Prepare validated development release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to prepare as a draft prerelease; run workflow at that tag'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: astra-development-package
          path: packages
      - name: Verify files
        working-directory: packages
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'packages/*'
      - name: Prepare draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TAG"
          gh release create "$TAG" packages/* --verify-tag --draft --prerelease --title "ASTRA engineering prototype $TAG" --notes 'Real firmware and matching source; emulator-tested only. Not hardware-tested. Provisional development identity. See manifest and validation documentation. Not a final musical design.'
