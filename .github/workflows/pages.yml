# SPDX-License-Identifier: GPL-3.0-only
# Adapted from MIKU-FM1's pages.yml (MIT, same owner).
# The site (GitHub Pages): the front page and the installer (site/, tools/site_front.sh), the package in firmware/,
# and fm1-emu/ = that same package emulated (tools/site_emu.sh). The page installs exactly what its emulator runs.
#   - a published release, or a manual run with a release tag: the release's package is downloaded;
#   - a push to main: the latest published release's package; while no release exists, a development build of main
#     made here (labelled "not attested");
#   - a manual run without a tag: a development build of main.
# Either way the package is booted in fm1-emu first (tools/emu_smoke.sh): controls, state, astronomy bit for bit,
# sound and screen must pass, or nothing is published.
# Repository settings: Pages > Source: GitHub Actions; for releases the github-pages environment must allow tags v*.
name: Pages

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "a release tag (vX.Y) whose package the site carries; empty: build main here (development build)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  AC79_SDK_TAG: AC79NN_SDK_V1.2.1_2023-12-13
  AC79_SDK_COMMIT: d179b4484759423312073f5fbb232501aa491047
  FM1_EMU_COMMIT: 9de1ef053a3c4bf56f16f05b5f0de193f4608a1d

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || '' }}
      - name: Host build (the emulator gate's expected values come from it)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m pip install -q Pillow
          mkdir -p build/site/firmware
          if [ -z "$TAG" ] && [ "$EVENT" = push ]; then
            TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            [ -n "$TAG" ] && echo "push to main: the site carries release $TAG"
          fi
          # the toolchain is needed either way: build.sh also writes the probe address the gate reads
          mkdir -p "$RUNNER_TEMP/tc" && cd "$RUNNER_TEMP/tc"
          curl -fL --retry 3 --connect-timeout 30 --max-time 600 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ
          cd "$GITHUB_WORKSPACE"
          tc=$(find "$RUNNER_TEMP/tc" -maxdepth 1 -mindepth 1 -type d | head -n 1)
          sdk="$RUNNER_TEMP/ac79sdk"
          tools/get_sdk.sh "$sdk"            # three files, pinned and SHA-256 checked; a time-limited clone only as fallback
          if [ -n "$TAG" ]; then
            version=${TAG#v}; kind=release
            JIELI_TOOLCHAIN="$tc" AC79_SDK="$sdk" bash native/build.sh --release "$version"
            gh release download "$TAG" --pattern "astra-$version.fwsc" --dir build/site/firmware
            cp "build/native/astra-$version-probe.txt" build/native/astra-probe.txt
          else
            version=dev; kind=dev
            JIELI_TOOLCHAIN="$tc" AC79_SDK="$sdk" bash native/build.sh
            cp build/native/astra.fwsc build/site/firmware/astra-dev.fwsc
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "KIND=$kind" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: build/fm1-emu-src/target
          key: fm1-emu-${{ env.FM1_EMU_COMMIT }}-pages
      - name: fm1-emu
        run: |
          set -euo pipefail
          mkdir -p build/fm1-emu-src && cd build/fm1-emu-src
          git init -q && git fetch -q --depth 1 https://github.com/joakimeriksson/fm1-emu "$FM1_EMU_COMMIT"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          cargo build -q --release -p fm1-emu
      - name: Boot it in fm1-emu (controls, state, astronomy, sound, screen)
        run: tools/emu_smoke.sh "build/site/firmware/astra-$VERSION.fwsc" build/native/astra-probe.txt build/emu build/emu_expect build/fm1-emu-src/target/release/fm1-emu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence
          path: |
            build/emu/boot.log
            build/emu/audio.wav
            build/emu/work/lcd_*.bmp
      - name: Site
        run: |
          set -euo pipefail
          tools/site_emu.sh build/site "$VERSION" build/fm1-emu-src
          tools/site_front.sh build/site "$VERSION" "$KIND" "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
